<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EnergyAutomation</title><script src="qrc:///qtwebchannel/qwebchannel.js"></script><link rel="stylesheet" href="styles.css"></head><body><div class="app"><aside><div class="brand"><img src="../assets/savera-logo.jpg"><div><b>EnergyAutomation</b><small>EMS Operations</small></div></div><nav><button data-page="dashboard" class="nav active">Dashboard</button><button data-page="automation" class="nav">Automation</button><button data-page="reports" class="nav">Reports</button><button data-page="history" class="nav">History</button><button data-page="settings" class="nav">Settings</button></nav></aside><main><header><div><h1 id="page-title">Dashboard</h1><p>Automated NBSense energy reporting and monitoring</p></div><div><span id="schedulerTimerStatus" class="pill">Scheduler: —</span> <button id="refresh-btn">Refresh</button> <button id="run-btn" class="primary">Run Now</button></div></header><section id="dashboard" class="page active"><div class="cards"><article><span>Scheduler</span><b id="scheduler-status">—</b></article><article><span>Last Run</span><b id="last-run">—</b></article><article><span>Next Run</span><b id="next-run">—</b></article><article><span>System</span><b id="system-status">Healthy</b></article></div><div class="panel"><h2>Live Activity</h2><div id="activity-list" class="empty">No activity yet.</div></div></section><section id="automation" class="page"><div class="panel"><h2>Automation Control</h2><button id="automation-run" class="primary">Run Automation</button> <button id="automation-stop">Stop Scheduler</button> <button id="automation-refresh">Refresh Status</button><pre id="automation-log"></pre></div></section><section id="reports" class="page"><div class="panel"><h2>Energy Reports</h2><table><thead><tr><th>Date</th><th>Meter</th><th>Energy</th><th>Unit</th><th>Status</th></tr></thead><tbody id="report-table"></tbody></table></div></section><section id="history" class="page"><div class="panel"><h2>Processing History</h2><div id="history-list" class="empty">No history available.</div></div></section><section id="settings" class="page"><div class="panel"><h2>Settings</h2><div class="grid"><label>Gmail sender<input id="gmail-sender"></label><label>Subject<input id="gmail-subject"></label><label>Search days<input id="gmail-days" type="number"></label><label>Interval<input id="interval" type="number"></label><label>Excel workbook<input id="excel-file"></label><label>Worksheet<input id="worksheet"></label></div><button id="save-settings" class="primary">Save Settings</button></div></section></main><div id="globalNotifications" class="notifications"></div></div><script src="app.js"></script></body></html>
